name: 3. Build & Publish to ECR

on:
  workflow_run:
    workflows: ["2. Create Semantic Release"] # Debe coincidir con el 'name' exacto del pipeline 2
    types:
      - completed

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/Versión a publicar (ej. v1.0.0)'
        required: false

permissions:
  contents: read

jobs:
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Solo se ejecuta si el pipeline 2 terminó con éxito (o si es ejecución manual)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Dynamic Image Tag
        id: resolve-tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # Obtiene el último tag de Git recién creado por el paso 2
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
          fi

          TAG=$(echo "$TAG" | xargs)
          echo "RESOLVED_TAG=$TAG" >> $GITHUB_ENV
          echo "Tag resuelto exitosamente: $TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package Application (Skip Tests)
        run: mvn -B package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_AUTH }}
          IMAGE_TAG: ${{ env.RESOLVED_TAG }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          echo "Construyendo imagen $IMAGE_URI..."
          docker build -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          
          echo "Subiendo imágenes a ECR..."
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"