spring.application.name=products
server.port=${PORT:8080}

# Local Postgres (Docker/Desktop)
spring.r2dbc.url=${R2DBC_URL:}
spring.r2dbc.username=${DB_USERNAME:}
spring.r2dbc.password=${DB_PASSWORD:}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=${DB_POOL_MAX_SIZE:10}

# Flyway via JDBC
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_JDBC_URL:}
spring.flyway.user=${DB_USERNAME:}
spring.flyway.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration

# JWT
security.jwt.secret=${JWT_SECRET:change-me-with-at-least-32-characters-secret}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=${JWT_ISSUER:agroventa-auth-service-local}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
app.aws.s3.region=${AWS_REGION:us-east-1}
app.aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.aws.s3.prefix=${AWS_S3_PREFIX:products}
app.aws.s3.max-file-size=${AWS_S3_MAX_FILE_SIZE:5242880}
app.aws.s3.allowed-content-types=${AWS_S3_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
app.aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
